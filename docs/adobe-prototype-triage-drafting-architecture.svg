<text x="40" y="44" font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#1d1d1f" text-anchor="start">From brief to published document: request triage, drafting and the generation loop</text>
<text x="40" y="70" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#555" text-anchor="start">Solid blue: built in the prototype.  Dashed purple: proposed extension.  Grey: production equivalent of each prototype part.</text>
<text x="40" y="108" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#6f42c1" text-anchor="start">Request intake, triage and drafting (proposed)</text>
<rect x="60" y="122" width="330" height="190" rx="10" fill="#f4eefc" stroke="#6f42c1" stroke-width="2" stroke-dasharray="9 5"/>
<text x="76" y="150" font-family="Helvetica, Arial, sans-serif" font-size="16.5" font-weight="700" fill="#1d1d1f">Workfront: structured brief</text>
<text x="76" y="174" font-family="Helvetica, Arial, sans-serif" font-size="12.8" fill="#1d1d1f">Request type, documents and brands</text>
<text x="76" y="193" font-family="Helvetica, Arial, sans-serif" font-size="12.8" fill="#1d1d1f">Change set: what, where, effective date</text>
<text x="76" y="212" font-family="Helvetica, Arial, sans-serif" font-size="12.8" fill="#1d1d1f">Owner, priority and release date</text>
<text x="76" y="231" font-family="Helvetica, Arial, sans-serif" font-size="12.8" fill="#1d1d1f">Markups attached, never re-typed</text>
<text x="76" y="300" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-style="italic" fill="#5a5a5a">Problems 14, 17, 19, 20</text>
<rect x="450" y="122" width="330" height="190" rx="10" fill="#f4eefc" stroke="#6f42c1" stroke-width="2" stroke-dasharray="9 5"/>
<text x="466" y="150" font-family="Helvetica, Arial, sans-serif" font-size="16.5" font-weight="700" fill="#1d1d1f">Triage application (AI-enabled)</text>
<text x="466" y="174" font-family="Helvetica, Arial, sans-serif" font-size="12.8" fill="#1d1d1f">Checks structure and required data</text>
<text x="466" y="193" font-family="Helvetica, Arial, sans-serif" font-size="12.8" fill="#1d1d1f">Reads markups into one structured change set</text>
<text x="466" y="212" font-family="Helvetica, Arial, sans-serif" font-size="12.8" fill="#1d1d1f">Asks the requester for anything missing</text>
<text x="466" y="231" font-family="Helvetica, Arial, sans-serif" font-size="12.8" fill="#1d1d1f">Routes to drafting or back to the requester</text>
<text x="466" y="300" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-style="italic" fill="#5a5a5a">Problems 14, 15, 17</text>
<rect x="840" y="122" width="330" height="190" rx="10" fill="#f4eefc" stroke="#6f42c1" stroke-width="2" stroke-dasharray="9 5"/>
<text x="856" y="150" font-family="Helvetica, Arial, sans-serif" font-size="16.5" font-weight="700" fill="#1d1d1f">Drafting application (AI-enabled)</text>
<text x="856" y="174" font-family="Helvetica, Arial, sans-serif" font-size="12.8" fill="#1d1d1f">Applies the change set as a draft: stories,</text>
<text x="856" y="193" font-family="Helvetica, Arial, sans-serif" font-size="12.8" fill="#1d1d1f">data values and templates, within brand rules</text>
<text x="856" y="212" font-family="Helvetica, Arial, sans-serif" font-size="12.8" fill="#1d1d1f">Runs the prototype's validation and checks</text>
<text x="856" y="231" font-family="Helvetica, Arial, sans-serif" font-size="12.8" fill="#1d1d1f">Writes a change summary for the reviewer</text>
<text x="856" y="300" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-style="italic" fill="#5a5a5a">Problems 5, 15, 16, 17</text>
<rect x="1230" y="122" width="330" height="190" rx="10" fill="#f4eefc" stroke="#6f42c1" stroke-width="2" stroke-dasharray="9 5"/>
<text x="1246" y="150" font-family="Helvetica, Arial, sans-serif" font-size="16.5" font-weight="700" fill="#1d1d1f">Workfront: review and approval</text>
<text x="1246" y="174" font-family="Helvetica, Arial, sans-serif" font-size="12.8" fill="#1d1d1f">Content owner reviews the draft release</text>
<text x="1246" y="193" font-family="Helvetica, Arial, sans-serif" font-size="12.8" fill="#1d1d1f">Approve: a generation request is raised</text>
<text x="1246" y="212" font-family="Helvetica, Arial, sans-serif" font-size="12.8" fill="#1d1d1f">Reject: back to drafting with comments</text>
<text x="1246" y="231" font-family="Helvetica, Arial, sans-serif" font-size="12.8" fill="#1d1d1f">Every step recorded for audit</text>
<text x="1246" y="300" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-style="italic" fill="#5a5a5a">Problems 13, 20</text>
